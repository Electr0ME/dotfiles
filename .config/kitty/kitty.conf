# ============================================================
#  ~/.config/kitty/kitty.conf
#  Kitty 配置 — Catppuccin Mocha + JetBrainsMono Nerd Font
#  改完按 Ctrl+Shift+F5 重载，无需重启
# ============================================================

# ---------- 主题 ----------
# 换主题只需替换这一行指向 themes/ 里的文件
include themes/catppuccin-mocha.conf

# ---------- 字体 ----------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# 行高（百分比，新版改为 modify_font）
modify_font cell_height 100%

# 连字：never | cursor | always
disable_ligatures never

# 带斜杠的 0，方便区分 O/0
font_features JetBrainsMonoNF-Regular +zero
font_features JetBrainsMonoNF-Bold    +zero

# 中日韩字符回退到思源等宽（避免落到韩文字形）
symbol_map U+3000-U+303F,U+3400-U+4DBF,U+4E00-U+9FFF,U+FF00-U+FFEF Noto Sans Mono CJK SC

# ---------- 光标 ----------
cursor_shape              beam
cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0

# ---------- 滚动 ----------
scrollback_lines 10000
wheel_scroll_multiplier  3.0
touch_scroll_multiplier  1.0
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ---------- 鼠标 ----------
mouse_hide_wait 2.0
detect_urls     yes
url_style       curly
open_url_with   default
copy_on_select  clipboard

# ---------- 窗口 ----------
hide_window_decorations titlebar-only
# 不恢复上次的尺寸或最大化状态；在 Niri 中由平铺布局决定窗口尺寸。
remember_window_size   no
initial_window_width   120c
initial_window_height  34c
window_padding_width   12
window_border_width    1
inactive_text_alpha    0.75
dynamic_background_opacity yes
confirm_os_window_close -1
clipboard_max_size      64

# ---------- 标签栏 ----------
tab_bar_edge         bottom
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_template          "{index}: {title}"
active_tab_title_template   "{index}: {title}"

# ---------- 布局 ----------
enabled_layouts splits
placement_strategy center

# ---------- 声音 ----------
enable_audio_bell     no
visual_bell_duration  0.0
bell_on_tab           "🔔 "

# ---------- 快捷键 ----------
# kitty 默认已绑定（无需重复配置）：
#   Ctrl+Shift+T/W        新建 / 关闭标签
#   Ctrl+Shift+←/→        切换标签
#   Ctrl+Shift+Enter      新建窗口
#   Ctrl+Shift+R          调整窗口大小（5 秒内用方向键）
#   Ctrl+Shift+Space      切换布局
#   Ctrl+Shift+C/V        复制 / 粘贴
#   Ctrl+Shift+±          字体缩放，Ctrl+Shift+Backspace 复位
#   Ctrl+Shift+F5         重载配置，Ctrl+Shift+F1 帮助
# 注意：不要在 Ctrl+Shift+字母 上重复绑定，否则默认动作也会一起触发。

# ---------- 高级 ----------
# Shell 集成（命令块跳转、cwd 同步、prompt 标记等），光标形状保持自定义
shell_integration no-cursor

# 远程控制：仅通过本地 socket，方便 kitty @ 与脚本调用
allow_remote_control socket-only
listen_on unix:@kitty-${USER}

# 不检查更新（Arch 由包管理器负责）
update_check_interval 0
# BEGIN Denial managed appearance: 1-3fd999999999999a
# Changes made to this block will be lost
background_opacity 0.8
# END Denial managed appearance
